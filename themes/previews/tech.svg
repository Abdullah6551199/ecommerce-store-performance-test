<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&amp;family=Space+Grotesk:wght@500;700&amp;family=Playfair+Display:ital,wght@0,600;1,400&amp;display=swap');
      .heading { font-family: 'Inter', sans-serif; font-weight: 800; }
      .body { font-family: 'Inter', sans-serif; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.15" />
    </filter>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="800" fill="#0F172A" />

  <!-- Top Announcement Bar -->
  <rect x="0" y="0" width="1200" height="42" fill="#0EA5E9" />
  <text x="600" y="26" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600" class="body" letter-spacing="1">
    PREVIEWING NEXUS TECH • TECH EDITION
  </text>

  <!-- Header Bar -->
  <rect x="0" y="42" width="1200" height="80" fill="#1E293B" stroke="#334155" stroke-width="1" />
  <circle cx="90" cy="82" r="16" fill="#0EA5E9" />
  <text x="120" y="88" fill="#F8FAFC" font-size="22" class="heading">NEXUS // TECH</text>

  <!-- Navigation items -->
  <text x="650" y="87" fill="#F8FAFC" font-size="14" font-weight="500" class="body">Shop</text>
  <text x="730" y="87" fill="#F8FAFC" font-size="14" font-weight="500" class="body">Collections</text>
  <text x="840" y="87" fill="#F8FAFC" font-size="14" font-weight="500" class="body">Stories</text>
  <rect x="940" y="64" width="170" height="36" rx="8" fill="#0EA5E9" />
  <text x="1025" y="86" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700" class="body">Explore Store</text>

  <!-- Hero Section Mockup -->
  <g transform="translate(60, 160)">
    <!-- Card Backing -->
    <rect width="1080" height="300" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" filter="url(#shadow)" />

    <!-- Category Pill -->
    <rect x="50" y="45" width="120" height="26" rx="8" fill="#38BDF8" opacity="0.15" />
    <text x="110" y="62" text-anchor="middle" fill="#38BDF8" font-size="11" font-weight="700" class="body">
      TECH
    </text>

    <!-- Main Title -->
    <text x="50" y="115" fill="#F8FAFC" font-size="36" class="heading" letter-spacing="-0.5">
      Nexus Tech
    </text>

    <!-- Subtitle description -->
    <text x="50" y="155" fill="#94A3B8" font-size="16" class="body">
      Futuristic dark slate palette, electric cyan highlights, sleek sticky header, and dense grid layouts.
    </text>

    <!-- Spec Badges -->
    <g transform="translate(50, 195)">
      <rect x="0" y="0" width="140" height="32" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <text x="70" y="21" text-anchor="middle" fill="#F8FAFC" font-size="12" font-weight="600" class="body">Spacing: 64px</text>

      <rect x="150" y="0" width="130" height="32" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <text x="215" y="21" text-anchor="middle" fill="#F8FAFC" font-size="12" font-weight="600" class="body">Radius: 8px</text>

      <rect x="290" y="0" width="170" height="32" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <text x="375" y="21" text-anchor="middle" fill="#F8FAFC" font-size="12" font-weight="600" class="body">Font: Inter</text>
    </g>

    <!-- CTA Button -->
    <rect x="50" y="240" width="180" height="42" rx="8" fill="#0EA5E9" />
    <text x="140" y="266" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700" class="body">Live Preview &rarr;</text>

    <!-- Color Palette Swatches inside Hero -->
    <g transform="translate(680, 50)">
      <text x="0" y="0" fill="#94A3B8" font-size="12" font-weight="600" class="body">PALETTE TOKENS</text>
      
      <circle cx="20" cy="35" r="18" fill="#0EA5E9" stroke="#000000" stroke-opacity="0.1" />
      <text x="20" y="70" text-anchor="middle" fill="#94A3B8" font-size="10" class="body">Primary</text>

      <circle cx="75" cy="35" r="18" fill="#0284C7" stroke="#000000" stroke-opacity="0.1" />
      <text x="75" y="70" text-anchor="middle" fill="#94A3B8" font-size="10" class="body">Secondary</text>

      <circle cx="130" cy="35" r="18" fill="#38BDF8" stroke="#000000" stroke-opacity="0.1" />
      <text x="130" y="70" text-anchor="middle" fill="#94A3B8" font-size="10" class="body">Accent</text>

      <circle cx="185" cy="35" r="18" fill="#1E293B" stroke="#334155" stroke-width="2" />
      <text x="185" y="70" text-anchor="middle" fill="#94A3B8" font-size="10" class="body">Surface</text>

      <circle cx="240" cy="35" r="18" fill="#0F172A" stroke="#334155" stroke-width="2" />
      <text x="240" y="70" text-anchor="middle" fill="#94A3B8" font-size="10" class="body">Canvas</text>
    </g>
  </g>

  <!-- Showcase Products Mini-Grid -->
  <g transform="translate(60, 490)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="340" height="260" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <rect x="20" y="20" width="300" height="130" rx="8" fill="url(#primaryGrad)" opacity="0.85" />
    <circle cx="170" cy="85" r="28" fill="#FFFFFF" opacity="0.3" />
    <text x="20" y="180" fill="#F8FAFC" font-size="16" font-weight="700" class="heading">Featured Product Alpha</text>
    <text x="20" y="205" fill="#0EA5E9" font-size="16" font-weight="800" class="body">$149.00</text>
    <rect x="20" y="220" width="300" height="28" rx="8" fill="#0EA5E9" />
    <text x="170" y="238" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700" class="body">Add to Cart</text>

    <!-- Card 2 -->
    <rect x="370" y="0" width="340" height="260" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <rect x="390" y="20" width="300" height="130" rx="8" fill="#0284C7" opacity="0.85" />
    <circle cx="540" cy="85" r="28" fill="#FFFFFF" opacity="0.3" />
    <text x="390" y="180" fill="#F8FAFC" font-size="16" font-weight="700" class="heading">Signature Edition Beta</text>
    <text x="390" y="205" fill="#0EA5E9" font-size="16" font-weight="800" class="body">$289.00</text>
    <rect x="390" y="220" width="300" height="28" rx="8" fill="#0EA5E9" />
    <text x="540" y="238" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700" class="body">Add to Cart</text>

    <!-- Card 3 -->
    <rect x="740" y="0" width="340" height="260" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <rect x="760" y="20" width="300" height="130" rx="8" fill="#38BDF8" opacity="0.85" />
    <circle cx="910" cy="85" r="28" fill="#FFFFFF" opacity="0.3" />
    <text x="760" y="180" fill="#F8FAFC" font-size="16" font-weight="700" class="heading">Limited Capsule Gamma</text>
    <text x="760" y="205" fill="#0EA5E9" font-size="16" font-weight="800" class="body">$89.00</text>
    <rect x="760" y="220" width="300" height="28" rx="8" fill="#0EA5E9" />
    <text x="910" y="238" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700" class="body">Add to Cart</text>
  </g>
</svg>